name: Offline regression tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: |
          python -m pytest tests -q
          python -m unittest discover -s tests -p 'test_*.py' -q
          python -m py_compile app.py decomposition.py breadth.py data_sources/*.py
      - name: JavaScript logic and syntax
        run: |
          node tests/test_time_axis.js
          node --check static/app.js
          node --check static/breadth.js
