name: Offline regression tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        run: |
          python -m pytest tests -q
          python -m unittest discover -s tests -p 'test_*.py' -q
          python -m py_compile app.py decomposition.py breadth.py asset_watch.py data_sources/*.py
      - name: JavaScript logic and syntax
        run: |
          node tests/test_time_axis.js
          node --check static/app.js
          node --check static/breadth.js
          node --check static/asset-watch.js

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Start local dashboard
        run: |
          python app.py serve --port 8765 > /tmp/value-lab-server.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for i in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/") as response:
                      assert response.status == 200
                  print("Value Lab HTTP server ready")
                  break
              except Exception:
                  if i == 29:
                      raise
                  time.sleep(1)
          PY
      - name: Playwright dashboard and v0.9 pages
        env:
          DASHBOARD_URL: http://127.0.0.1:8765
        run: |
          python tests/browser_time_axis.py
          python tests/browser_breadth.py
          python tests/browser_assets.py
      - name: Upload screenshots and diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: |
            artifacts/v09-*.png
            /tmp/value-lab-server.log
          if-no-files-found: ignore
